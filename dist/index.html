<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3d63">
  <title>發票費用登錄</title>
  <meta name="description" content="掃描電子發票 QR Code，整理加油與停車費用並匯出會計格式。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">費用憑證</p>
        <h1>發票登錄</h1>
      </div>
      <div class="count"><strong id="rowCount">0</strong><span>筆待匯出</span></div>
    </header>

    <section class="card setup" aria-labelledby="setupTitle">
      <h2 id="setupTitle">登錄設定</h2>
      <div class="field-grid">
        <label>登錄者
          <select id="person" required>
            <option value="">請選擇</option>
            <option>蔣世傑經理</option><option>林奇勳督導</option><option>林立副理</option>
            <option>張哲瑋督導</option><option>洪琨韋副理</option><option>曾建民督導</option>
          </select>
        </label>
        <label>登錄月份
          <select id="month" required></select>
        </label>
      </div>
      <details class="database-settings">
        <summary>Google 試算表資料庫設定</summary>
        <label>Apps Script 網址
          <input id="scriptUrl" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
        </label>
        <div class="database-actions">
          <button class="secondary" id="saveScriptUrl" type="button">儲存網址</button>
          <span id="databaseState" class="database-state">尚未連接</span>
        </div>
        <small>每台手機第一次使用時設定即可。未連接時仍可掃描並匯出 Excel。</small>
      </details>
    </section>

    <section class="scan-card" aria-labelledby="scanTitle">
      <div class="scan-heading">
        <div><span class="step">01</span><h2 id="scanTitle">掃描發票 QR Code</h2></div>
        <span id="scanState" class="status">尚未掃描</span>
      </div>
      <div class="camera-wrap" id="cameraWrap">
        <video id="video" playsinline muted></video>
        <canvas id="canvas" hidden></canvas>
        <div class="scan-frame" aria-hidden="true"></div>
        <div class="camera-empty" id="cameraEmpty">
          <div class="qr-icon">⌗</div>
          <p>依序對準發票左右兩個 QR Code</p>
          <small>資料只在這台裝置處理</small>
        </div>
      </div>
      <div class="scan-actions">
        <button class="primary" id="startScan" type="button">開啟相機掃描</button>
        <label class="secondary file-button">從照片辨識<input id="imageInput" type="file" accept="image/*" capture="environment"></label>
      </div>
      <details>
        <summary>無法掃描？手動輸入</summary>
        <div class="manual-grid">
          <label>發票號碼<input id="invoiceNumber" inputmode="text" placeholder="CU19705076" maxlength="10"></label>
          <label>發票日期<input id="invoiceDate" inputmode="numeric" placeholder="1150804" maxlength="7"></label>
          <label>賣方統編<input id="sellerId" inputmode="numeric" placeholder="50024409" maxlength="8"></label>
          <label>總金額<input id="totalAmount" type="number" min="0" placeholder="1001"></label>
          <label>未稅金額<input id="netAmount" type="number" min="0" placeholder="953"></label>
        </div>
      </details>
    </section>

    <section class="card result" aria-labelledby="resultTitle">
      <div class="section-title"><span class="step">02</span><h2 id="resultTitle">確認資料</h2></div>
      <div class="type-row">
        <span>費用類別</span>
        <div class="segmented" role="radiogroup" aria-label="費用類別">
          <label><input type="radio" name="expenseType" value="加油費用"><span>加油費用</span></label>
          <label><input type="radio" name="expenseType" value="停車費用"><span>停車費用</span></label>
        </div>
        <small id="typeHint">掃描後自動判斷，必要時可手動修改</small>
      </div>
      <dl class="preview">
        <div><dt>憑證號碼</dt><dd id="pNumber">—</dd></div>
        <div><dt>憑證日期</dt><dd id="pDate">—</dd></div>
        <div><dt>憑證總金額</dt><dd id="pTotal">—</dd></div>
        <div><dt>未稅金額</dt><dd id="pNet">—</dd></div>
      </dl>
      <div class="summary-box"><span>摘要</span><strong id="summaryPreview">請先選擇登錄者與費用類別</strong></div>
      <button class="add" id="addRecord" type="button">儲存這筆資料</button>
    </section>

    <section class="records" aria-labelledby="recordsTitle">
      <div class="records-head"><h2 id="recordsTitle">待匯出清單</h2><button id="clearAll" class="text-button" type="button">全部清除</button></div>
      <div id="emptyState" class="empty">完成掃描後，資料會顯示在這裡。</div>
      <div id="recordList" class="record-list"></div>
      <button id="exportXls" class="export" type="button" disabled>匯出 pay.xls</button>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
